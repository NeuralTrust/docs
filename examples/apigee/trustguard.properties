# Environment-scoped property set "trustguard" (upload as resource file type "properties",
# name "trustguard"). Read as propertyset.trustguard.<key>.
#
# TrustGuard host only (no scheme, no path). SaaS: the host shown on the collector's
# Connection tab, e.g. trustguard.neuraltrust.ai. Self-hosted: trustguard.<domain> (chart
# Ingress / OpenShift Route), never the in-cluster service or TRUSTGUARD_URL.
host=trustguard.neuraltrust.ai
# Master switch.
enabled=true
# Comma-separated API proxy names to evaluate, or * for all. Use a list when the shared flow
# is attached with an environment flow hook and the environment also serves non-LLM APIs.
proxies=*
# What happens when TrustGuard cannot answer (timeout, connection/TLS error, 4xx/5xx,
# unparseable body, oversize body, script error): closed -> 503 to the caller; open -> forward.
# Detector outages are NOT covered by this: TrustGuard itself fails those closed (status block,
# signal guard_failed_closed) for API-key callers, whatever this says.
fail_mode=closed
# full = send the whole provider body (recommended: system prompt, history, tool definitions
# and tool results are all evaluated, Indirect Prompt Injection works). minimal = {input: latest user text}.
payload_mode=full
# auto = JSON-RPC 2.0 bodies are sent as protocol mcp, everything else as llm. Or force llm / mcp.
protocol=auto
# Evaluate model responses (direction output) too.
evaluate_output=true
# Forward the masked request body when the verdict is transform (DLP Transform rule, Input).
# Requires payload_mode=full. Only non-streamed requests.
mask_request=false
# Write the masked completion back into the response (single-text completions only).
mask_response=false
# If a transform verdict cannot be applied (masking off or not possible): forward | block
transform_fallback=forward
# What to do with "ask" (no approval step in Apigee): forward | block
ask_policy=forward
# "stream": true requests: allow (prompt is evaluated, streamed completion is not) | reject (400)
stream_policy=allow
# Optional attributes.model.provider value, e.g. openai, anthropic, google
model_provider=
# Bodies larger than this are not sent; fail_mode applies. TrustGuard answers 413 "request body too large"
# above its limit (10 MiB by default).
max_body_bytes=9437184
