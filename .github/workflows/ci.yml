# CI pipeline for PRs targeting main
# Runs: AI code review → Lint & Tests (Python) → SAST → auto-approve

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: read
  security-events: write
  id-token: write

jobs:
  security:
    uses: NeuralTrust/workflows/.github/workflows/sast.yml@main
    with:
      bandit_enabled: true

  auto-approve:
    needs: [security]
    uses: NeuralTrust/workflows/.github/workflows/auto-approve.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
