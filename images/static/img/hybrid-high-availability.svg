<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Hybrid regional active-passive high availability</title>
  <desc id="description">Clients use global LLM and MCP endpoints that route to an active Hybrid data plane in Region A. A passive data plane in Region B independently pulls gateway-scoped security configuration from the NeuralTrust SaaS control plane and can be promoted by customer-operated automation if Region A fails. Runtime and historical data are not replicated between regions.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#596579" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d5dfc" />
    </marker>
    <style>
      .page-title { font: 700 30px Inter, Arial, sans-serif; fill: #101828; }
      .page-subtitle { font: 500 16px Inter, Arial, sans-serif; fill: #667085; }
      .boundary { fill: #f8fafc; stroke: #98a2b3; stroke-width: 2.5; }
      .active-boundary { fill: #f2fbf5; stroke: #55b77c; }
      .passive-boundary { fill: #f7fbff; stroke: #61aee0; }
      .saas-boundary { fill: #fafaff; stroke: #8b7ffd; }
      .service { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; }
      .security { fill: #fff5e8; stroke: #f4aa4c; }
      .control { fill: #f1efff; stroke: #8b7ffd; }
      .store { fill: #f9fafb; stroke: #98a2b3; }
      .active-pill { fill: #dcfae6; stroke: #55b77c; }
      .passive-pill { fill: #eaf6ff; stroke: #61aee0; }
      .title { font: 700 23px Inter, Arial, sans-serif; fill: #101828; }
      .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #667085; }
      .label { font: 650 15px Inter, Arial, sans-serif; fill: #1d2939; text-anchor: middle; }
      .small { font: 500 12px Inter, Arial, sans-serif; fill: #667085; text-anchor: middle; }
      .pill { font: 700 12px Inter, Arial, sans-serif; fill: #344054; text-anchor: middle; }
      .flow { fill: none; stroke: #596579; stroke-width: 2.5; marker-end: url(#arrow); }
      .standby { fill: none; stroke: #596579; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .config { fill: none; stroke: #6d5dfc; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .separation { fill: none; stroke: #d92d20; stroke-width: 2; stroke-dasharray: 7 6; }
      .flow-label { font: 600 13px Inter, Arial, sans-serif; fill: #475467; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
      .config-label { fill: #5b4ce1; }
      .warning-label { fill: #b42318; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="24" fill="#ffffff" />
  <text class="page-title" x="64" y="58">Regional active/passive Hybrid data planes</text>
  <text class="page-subtitle" x="64" y="86">Security configuration is synchronized; runtime and historical data are not replicated.</text>

  <!-- Clients and global routing -->
  <rect class="boundary" x="55" y="245" width="210" height="310" rx="24" />
  <text class="title" x="90" y="292">Clients</text>
  <text class="subtitle" x="90" y="318">Stable global endpoints</text>
  <rect class="service" x="85" y="350" width="150" height="70" rx="14" />
  <text class="label" x="160" y="380">LLM / proxy</text>
  <text class="small" x="160" y="402">global URL</text>
  <rect class="service" x="85" y="450" width="150" height="70" rx="14" />
  <text class="label" x="160" y="480">MCP</text>
  <text class="small" x="160" y="502">global URL</text>

  <rect class="boundary" x="315" y="290" width="220" height="220" rx="24" />
  <text class="title" x="350" y="337">Global routing</text>
  <text class="subtitle" x="350" y="363">DNS or traffic manager</text>
  <rect class="service" x="350" y="395" width="150" height="78" rx="14" />
  <text class="label" x="425" y="426">Health checks</text>
  <text class="small" x="425" y="450">one active region</text>

  <path class="flow" d="M265 400 H315" />
  <text class="flow-label" x="277" y="388">HTTPS</text>

  <!-- Active region -->
  <rect class="boundary active-boundary" x="610" y="115" width="470" height="315" rx="28" />
  <text class="title" x="650" y="162">Region A - Kubernetes cluster</text>
  <text class="subtitle" x="650" y="188">Active data plane</text>
  <rect class="active-pill" x="945" y="140" width="90" height="30" rx="15" />
  <text class="pill" x="990" y="160">ACTIVE</text>

  <rect class="service" x="650" y="225" width="155" height="72" rx="14" />
  <text class="label" x="727" y="255">TrustGate</text>
  <text class="small" x="727" y="278">multiple replicas</text>
  <rect class="service security" x="835" y="225" width="155" height="72" rx="14" />
  <text class="label" x="912" y="255">TrustGuard</text>
  <text class="small" x="912" y="278">multiple replicas</text>
  <path class="flow" d="M805 261 H835" />

  <rect class="service store" x="635" y="330" width="110" height="62" rx="14" />
  <text class="label" x="690" y="357">PostgreSQL</text>
  <text class="small" x="690" y="378">regional data</text>
  <rect class="service store" x="755" y="330" width="90" height="62" rx="14" />
  <text class="label" x="800" y="357">Redis</text>
  <text class="small" x="800" y="378">regional state</text>
  <rect class="service" x="855" y="330" width="90" height="62" rx="14" />
  <text class="label" x="900" y="357">DataAgent</text>
  <text class="small" x="900" y="378">enabled</text>
  <rect class="service control" x="955" y="330" width="100" height="62" rx="14" />
  <text class="label" x="1005" y="357">Local LKG</text>
  <text class="small" x="1005" y="378">persistent</text>

  <!-- Passive region -->
  <rect class="boundary passive-boundary" x="610" y="485" width="470" height="315" rx="28" />
  <text class="title" x="650" y="532">Region B - Kubernetes cluster</text>
  <text class="subtitle" x="650" y="558">Warm passive data plane</text>
  <rect class="passive-pill" x="945" y="510" width="90" height="30" rx="15" />
  <text class="pill" x="990" y="530">PASSIVE</text>

  <rect class="service" x="650" y="595" width="155" height="72" rx="14" />
  <text class="label" x="727" y="625">TrustGate</text>
  <text class="small" x="727" y="648">multiple replicas</text>
  <rect class="service security" x="835" y="595" width="155" height="72" rx="14" />
  <text class="label" x="912" y="625">TrustGuard</text>
  <text class="small" x="912" y="648">multiple replicas</text>
  <path class="flow" d="M805 631 H835" />

  <rect class="service store" x="635" y="700" width="110" height="62" rx="14" />
  <text class="label" x="690" y="727">PostgreSQL</text>
  <text class="small" x="690" y="748">regional data</text>
  <rect class="service store" x="755" y="700" width="90" height="62" rx="14" />
  <text class="label" x="800" y="727">Redis</text>
  <text class="small" x="800" y="748">regional state</text>
  <rect class="service" x="855" y="700" width="90" height="62" rx="14" />
  <text class="label" x="900" y="727">DataAgent</text>
  <text class="small" x="900" y="748">disabled</text>
  <rect class="service control" x="955" y="700" width="100" height="62" rx="14" />
  <text class="label" x="1005" y="727">Local LKG</text>
  <text class="small" x="1005" y="748">persistent</text>

  <!-- Traffic routing and failover -->
  <path class="flow" d="M535 380 C565 380 570 260 610 260" />
  <text class="flow-label" x="548" y="300">active traffic</text>
  <path class="standby" d="M535 440 C570 440 570 630 610 630" />
  <text class="flow-label" x="545" y="575">promote on failure</text>

  <!-- No data replication -->
  <path class="separation" d="M585 430 V485" />
  <text class="flow-label warning-label" x="422" y="463">no cross-region data replication</text>

  <!-- SaaS control plane -->
  <rect class="boundary saas-boundary" x="1160" y="215" width="380" height="470" rx="28" />
  <text class="title" x="1200" y="262">NeuralTrust SaaS</text>
  <text class="subtitle" x="1200" y="288">Shared control plane</text>

  <rect class="service control" x="1210" y="335" width="280" height="90" rx="16" />
  <text class="label" x="1350" y="370">Gateway-scoped configuration</text>
  <text class="small" x="1350" y="396">security policies and routing</text>

  <rect class="service control" x="1210" y="470" width="280" height="90" rx="16" />
  <text class="label" x="1350" y="505">Configuration sync service</text>
  <text class="small" x="1350" y="531">outbound pull endpoint</text>

  <path class="config" d="M1080 260 C1120 260 1120 360 1160 360" />
  <text class="flow-label config-label" x="1088" y="323">outbound config pull</text>
  <path class="config" d="M1080 630 C1120 630 1120 540 1160 540" />
  <text class="flow-label config-label" x="1088" y="596">outbound config pull</text>

  <text class="subtitle" x="1200" y="620">Each region independently pulls configuration.</text>
  <text class="subtitle" x="1200" y="644">Only the active region serves traffic.</text>
</svg>
