<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">NeuralTrust External (self-hosted) architecture</title>
  <desc id="description">In External, every plane runs in your cluster. Clients call TrustGate, TrustGate calls TrustGuard, and TrustGuard calls the Firewall classifiers. TrustGate calls your upstream LLM providers. The console, AgentGateway admin and TrustGuard control plane administer the data path in-cluster and keep their state in PostgreSQL. TrustGate and TrustGuard send OTLP to a ClickStack collector that writes to your own ClickHouse, which DataCore queries and AlertEngine evaluates. PostgreSQL holds raw payloads and five service databases, and Redis holds semantic cache and rate-limit state. There is no DataAgent and no runtime dependency on NeuralTrust SaaS.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#596579" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d5dfc" />
    </marker>
    <style>
      .boundary { fill: #f7fbff; stroke: #8bc5ea; stroke-width: 2.5; }
      .group { fill: #ffffff; stroke: #dde3ec; stroke-width: 2; stroke-dasharray: 6 5; }
      .service { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; }
      .control { fill: #f1efff; stroke: #8b7ffd; }
      .data { fill: #eef8ff; stroke: #61aee0; }
      .security { fill: #fff5e8; stroke: #f4aa4c; }
      .platform { fill: #effbf4; stroke: #55b77c; }
      .store { fill: #f9fafb; stroke: #98a2b3; stroke-width: 2; }
      .external { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; stroke-dasharray: 5 4; }
      .title { font: 700 22px Inter, Arial, sans-serif; fill: #101828; }
      .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #667085; }
      .grouplabel { font: 600 14px Inter, Arial, sans-serif; fill: #667085; }
      .label { font: 650 17px Inter, Arial, sans-serif; fill: #1d2939; text-anchor: middle; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #667085; text-anchor: middle; }
      .flow { fill: none; stroke: #596579; stroke-width: 2.2; marker-end: url(#arrow); }
      .metadata { fill: none; stroke: #6d5dfc; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .flow-label { font: 600 13px Inter, Arial, sans-serif; fill: #475467; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
      .metadata-label { fill: #5b4ce1; }
    </style>
  </defs>

  <rect width="1400" height="760" rx="24" fill="#ffffff" />

  <!-- Boundary -->
  <rect class="boundary" x="220" y="50" width="1150" height="610" rx="28" />
  <text class="title" x="252" y="94">Your cluster</text>
  <text class="subtitle" x="252" y="118">Control plane, data plane and analytics — you operate all of it</text>
  <!-- Outside: clients and upstreams -->
  <rect class="external" x="30" y="205" width="150" height="76" rx="14" />
  <text class="label" x="105" y="237">Your apps</text>
  <text class="small" x="105" y="260">and agents</text>

  <rect class="external" x="30" y="430" width="150" height="76" rx="14" />
  <text class="label" x="105" y="462">LLM providers</text>
  <text class="small" x="105" y="485">your upstreams</text>

  <!-- Request path group -->
  <rect class="group" x="258" y="150" width="700" height="160" rx="18" />
  <text class="grouplabel" x="280" y="176">Request path</text>

  <rect class="service data" x="280" y="196" width="190" height="90" rx="14" />
  <text class="label" x="375" y="236">TrustGate</text>
  <text class="small" x="375" y="259">proxy :8081 · MCP :8082</text>

  <rect class="service data" x="530" y="196" width="180" height="90" rx="14" />
  <text class="label" x="620" y="236">TrustGuard</text>
  <text class="small" x="620" y="259">data plane :8080</text>

  <rect class="service security" x="770" y="196" width="165" height="90" rx="14" />
  <text class="label" x="852" y="236">Firewall</text>
  <text class="small" x="852" y="259">classifiers · stateless</text>

  <path class="flow" d="M470 241 H530" />
  <text class="flow-label" x="500" y="230">evaluate</text>
  <path class="flow" d="M710 241 H770" />
  <text class="flow-label" x="740" y="230">classify</text>

  <path class="flow" d="M180 243 H280" />
  <text class="flow-label" x="230" y="232">requests</text>

  <path class="flow" d="M280 265 H248 V468 H180" />
  <text class="flow-label" x="214" y="457">calls out</text>
  <!-- In-cluster control plane -->
  <rect class="group" x="1000" y="150" width="350" height="290" rx="18" />
  <text class="grouplabel" x="1022" y="176">In-cluster control plane</text>

  <rect class="service platform" x="1022" y="196" width="306" height="76" rx="14" />
  <text class="label" x="1175" y="228">Console + API</text>
  <text class="small" x="1175" y="251">policies, dashboards, alerts</text>

  <rect class="service control" x="1022" y="288" width="306" height="60" rx="14" />
  <text class="label" x="1175" y="324">AgentGateway admin</text>

  <rect class="service control" x="1022" y="364" width="306" height="60" rx="14" />
  <text class="label" x="1175" y="400">TrustGuard control plane</text>

  <path class="metadata" d="M1022 318 C990 318 975 250 958 241" />
  <text class="flow-label metadata-label" x="1000" y="286">config</text>

  <path class="metadata" d="M1022 394 C980 394 700 380 620 296" />
  <text class="flow-label metadata-label" x="880" y="378">config</text>

  <!-- Datastores group -->
  <rect class="group" x="258" y="390" width="350" height="170" rx="18" />
  <text class="grouplabel" x="280" y="416">Your datastores</text>

  <rect class="store" x="278" y="440" width="142" height="90" rx="14" />
  <text class="label" x="349" y="480">Redis</text>
  <text class="small" x="349" y="503">:6379 cache, limits</text>

  <rect class="store" x="442" y="440" width="146" height="90" rx="14" />
  <text class="label" x="515" y="480">PostgreSQL</text>
  <text class="small" x="515" y="503">:5432 five databases</text>

  <path class="flow" d="M500 310 C500 350 433 350 433 390" />
  <text class="flow-label" x="370" y="352">payloads and state</text>

  <path class="flow" d="M1022 410 C860 410 640 420 608 452" />
  <text class="flow-label" x="800" y="424">control-plane state</text>
  <!-- Self-hosted analytics pipeline -->
  <rect class="group" x="640" y="470" width="710" height="150" rx="18" />
  <text class="grouplabel" x="662" y="496">Self-hosted analytics</text>

  <rect class="service platform" x="662" y="512" width="180" height="86" rx="14" />
  <text class="label" x="752" y="546">ClickStack</text>
  <text class="small" x="752" y="569">collector :4317 · :4318</text>

  <rect class="store" x="872" y="512" width="150" height="86" rx="14" />
  <text class="label" x="947" y="546">ClickHouse</text>
  <text class="small" x="947" y="569">:8123 · :9000</text>

  <rect class="service control" x="1052" y="512" width="140" height="86" rx="14" />
  <text class="label" x="1122" y="546">DataCore</text>
  <text class="small" x="1122" y="569">query API</text>

  <rect class="service control" x="1206" y="512" width="126" height="86" rx="14" />
  <text class="label" x="1269" y="546">AlertEngine</text>
  <text class="small" x="1269" y="569">rules</text>

  <path class="metadata" d="M740 310 C740 400 700 400 700 512" />
  <text class="flow-label metadata-label" x="668" y="404">OTLP</text>

  <path class="metadata" d="M842 555 H872" />
  <path class="metadata" d="M1022 555 H1052" />
  <path class="metadata" d="M1192 555 H1206" />

  <path class="metadata" d="M1122 440 V512" />
  <text class="flow-label metadata-label" x="1122" y="466">reads</text>

  <!-- Legend -->
  <line x1="258" y1="700" x2="308" y2="700" class="flow" />
  <text class="subtitle" x="320" y="705">Request path</text>
  <line x1="500" y1="700" x2="550" y2="700" class="metadata" />
  <text class="subtitle" x="562" y="705">Telemetry and analytics — all of it stays in your cluster. No DataAgent, and no runtime dependency on NeuralTrust SaaS.</text>
</svg>
