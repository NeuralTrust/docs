<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="730" viewBox="0 0 1560 730" role="img" aria-labelledby="title description">
  <title id="title">NeuralTrust Hybrid architecture</title>
  <desc id="description">In Hybrid, your environment runs the request path: clients call TrustGate, TrustGate calls TrustGuard, and TrustGuard calls the Firewall classifiers. TrustGate calls your upstream LLM providers. Raw payloads and cache stay in your PostgreSQL and Redis. TrustGate and TrustGuard send OTLP to a DataAgent egress collector in your cluster. Three outbound connections reach NeuralTrust SaaS — config sync, telemetry, and authorized retrieval — and all three are initiated from your environment.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#596579" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d5dfc" />
    </marker>
    <style>
      .boundary { fill: #f7fbff; stroke: #8bc5ea; stroke-width: 2.5; }
      .boundary-saas { fill: #fafaff; stroke: #c9c5ff; stroke-width: 2.5; }
      .group { fill: #ffffff; stroke: #dde3ec; stroke-width: 2; stroke-dasharray: 6 5; }
      .service { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; }
      .control { fill: #f1efff; stroke: #8b7ffd; }
      .data { fill: #eef8ff; stroke: #61aee0; }
      .security { fill: #fff5e8; stroke: #f4aa4c; }
      .platform { fill: #effbf4; stroke: #55b77c; }
      .store { fill: #f9fafb; stroke: #98a2b3; stroke-width: 2; }
      .external { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; stroke-dasharray: 5 4; }
      .title { font: 700 22px Inter, Arial, sans-serif; fill: #101828; }
      .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #667085; }
      .grouplabel { font: 600 14px Inter, Arial, sans-serif; fill: #667085; }
      .label { font: 650 17px Inter, Arial, sans-serif; fill: #1d2939; text-anchor: middle; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #667085; text-anchor: middle; }
      .flow { fill: none; stroke: #596579; stroke-width: 2.2; marker-end: url(#arrow); }
      .metadata { fill: none; stroke: #6d5dfc; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .flow-label { font: 600 13px Inter, Arial, sans-serif; fill: #475467; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
      .metadata-label { fill: #5b4ce1; }
    </style>
  </defs>

  <rect width="1560" height="730" rx="24" fill="#ffffff" />

  <!-- Boundaries -->
  <rect class="boundary" x="220" y="50" width="770" height="580" rx="28" />
  <text class="title" x="252" y="94">Your environment</text>
  <text class="subtitle" x="252" y="118">Hybrid data plane — you operate this</text>

  <rect class="boundary-saas" x="1110" y="50" width="410" height="580" rx="28" />
  <text class="title" x="1142" y="94">NeuralTrust SaaS</text>
  <text class="subtitle" x="1142" y="118">Control plane — we operate this</text>

  <!-- Outside: clients and upstreams -->
  <rect class="external" x="30" y="205" width="150" height="76" rx="14" />
  <text class="label" x="105" y="237">Your apps</text>
  <text class="small" x="105" y="260">and agents</text>

  <rect class="external" x="30" y="430" width="150" height="76" rx="14" />
  <text class="label" x="105" y="462">LLM providers</text>
  <text class="small" x="105" y="485">your upstreams</text>

  <!-- Request path group -->
  <rect class="group" x="258" y="150" width="700" height="160" rx="18" />
  <text class="grouplabel" x="280" y="176">Request path</text>

  <rect class="service data" x="280" y="196" width="190" height="90" rx="14" />
  <text class="label" x="375" y="236">TrustGate</text>
  <text class="small" x="375" y="259">proxy :8081 · MCP :8082</text>

  <rect class="service data" x="530" y="196" width="180" height="90" rx="14" />
  <text class="label" x="620" y="236">TrustGuard</text>
  <text class="small" x="620" y="259">data plane :8080</text>

  <rect class="service security" x="770" y="196" width="165" height="90" rx="14" />
  <text class="label" x="852" y="236">Firewall</text>
  <text class="small" x="852" y="259">classifiers · stateless</text>

  <path class="flow" d="M470 241 H530" />
  <text class="flow-label" x="500" y="230">evaluate</text>
  <path class="flow" d="M710 241 H770" />
  <text class="flow-label" x="740" y="230">classify</text>

  <!-- Datastores group -->
  <rect class="group" x="258" y="390" width="350" height="170" rx="18" />
  <text class="grouplabel" x="280" y="416">Your datastores</text>

  <rect class="store" x="278" y="440" width="142" height="90" rx="14" />
  <text class="label" x="349" y="480">Redis</text>
  <text class="small" x="349" y="503">cache and state</text>

  <rect class="store" x="442" y="440" width="146" height="90" rx="14" />
  <text class="label" x="515" y="480">PostgreSQL</text>
  <text class="small" x="515" y="503">raw payloads</text>

  <!-- DataAgent -->
  <rect class="service platform" x="680" y="430" width="270" height="110" rx="14" />
  <text class="label" x="815" y="468">DataAgent</text>
  <text class="small" x="815" y="492">with OTLP egress collector</text>
  <text class="small" x="815" y="514">one per enabled product</text>

  <!-- SaaS workloads -->
  <rect class="service platform" x="1142" y="150" width="346" height="76" rx="14" />
  <text class="label" x="1315" y="182">Console</text>
  <text class="small" x="1315" y="205">policies, dashboards, alerts</text>

  <rect class="service control" x="1142" y="262" width="346" height="86" rx="14" />
  <text class="label" x="1315" y="296">Configuration service</text>
  <text class="small" x="1315" y="319">TrustGate and TrustGuard config sync</text>

  <rect class="service control" x="1142" y="384" width="346" height="86" rx="14" />
  <text class="label" x="1315" y="418">Telemetry and analytics</text>
  <text class="small" x="1315" y="441">metadata only — no payloads</text>

  <rect class="service control" x="1142" y="506" width="346" height="86" rx="14" />
  <text class="label" x="1315" y="540">DataBridge</text>
  <text class="small" x="1315" y="563">authorized retrieval</text>

  <path class="flow" d="M1315 226 V262" />

  <!-- In-cluster flows -->
  <path class="flow" d="M180 243 H280" />
  <text class="flow-label" x="230" y="232">requests</text>

  <path class="flow" d="M280 265 H248 V468 H180" />
  <text class="flow-label" x="214" y="457">calls out</text>

  <path class="flow" d="M500 310 C500 350 433 350 433 390" />
  <text class="flow-label" x="370" y="352">payloads and state</text>

  <path class="flow" d="M740 310 C740 370 815 370 815 430" />
  <text class="flow-label" x="700" y="372">OTLP</text>

  <path class="flow" d="M680 485 H588" />
  <text class="flow-label" x="634" y="474">reads</text>

  <!-- Outbound to SaaS -->
  <path class="metadata" d="M958 295 H1142" />
  <text class="flow-label metadata-label" x="1050" y="285">config sync 443</text>

  <path class="metadata" d="M950 468 C1020 468 1070 430 1142 427" />
  <text class="flow-label metadata-label" x="1046" y="459">OTLP 443</text>

  <path class="metadata" d="M950 515 C1020 520 1070 546 1142 549" />
  <text class="flow-label metadata-label" x="1046" y="566">retrieval 443</text>

  <!-- Legend -->
  <line x1="258" y1="685" x2="308" y2="685" class="flow" />
  <text class="subtitle" x="320" y="690">Request path</text>
  <line x1="500" y1="685" x2="550" y2="685" class="metadata" />
  <text class="subtitle" x="562" y="690">Outbound to NeuralTrust — every one of these is initiated from your environment. Nothing dials in.</text>
</svg>
