<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">NeuralTrust SaaS and Hybrid architecture</title>
  <desc id="description">NeuralTrust SaaS hosts the application and control plane. A Hybrid customer environment hosts TrustGate and TrustGuard, with separate LLM proxy and MCP entry points. TrustGate and TrustGuard initiate outbound configuration pulls toward SaaS, while raw payloads remain in customer PostgreSQL and state is stored in Redis.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#596579" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d5dfc" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#101828" flood-opacity="0.10" />
    </filter>
    <style>
      .boundary { fill: #fafaff; stroke: #c9c5ff; stroke-width: 2.5; }
      .hybrid { fill: #f7fbff; stroke: #8bc5ea; }
      .service { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; filter: url(#shadow); }
      .control { fill: #f1efff; stroke: #8b7ffd; }
      .data { fill: #eef8ff; stroke: #61aee0; }
      .security { fill: #fff5e8; stroke: #f4aa4c; }
      .platform { fill: #effbf4; stroke: #55b77c; }
      .store { fill: #f9fafb; stroke: #98a2b3; stroke-width: 2; }
      .title { font: 700 26px Inter, Arial, sans-serif; fill: #101828; }
      .subtitle { font: 500 15px Inter, Arial, sans-serif; fill: #667085; }
      .label { font: 650 16px Inter, Arial, sans-serif; fill: #1d2939; text-anchor: middle; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #667085; text-anchor: middle; }
      .flow { fill: none; stroke: #596579; stroke-width: 2.2; marker-end: url(#arrow); }
      .metadata { fill: none; stroke: #6d5dfc; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .raw { fill: none; stroke: #344054; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-label { font: 600 13px Inter, Arial, sans-serif; fill: #475467; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
      .metadata-label { fill: #5b4ce1; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="24" fill="#ffffff" />

  <rect class="boundary" x="190" y="70" width="720" height="730" rx="28" />
  <text class="title" x="230" y="118">NeuralTrust SaaS</text>
  <text class="subtitle" x="230" y="145">Managed control plane and hosted data plane</text>

  <rect class="boundary hybrid" x="970" y="70" width="390" height="730" rx="28" />
  <text class="title" x="1010" y="118">Hybrid</text>
  <text class="subtitle" x="1010" y="145">Customer data plane</text>

  <!-- SaaS workloads -->
  <rect class="service platform" x="475" y="680" width="150" height="70" rx="14" />
  <text class="label" x="550" y="710">App</text>
  <text class="small" x="550" y="733">UI and API</text>

  <rect class="service platform" x="475" y="555" width="150" height="70" rx="14" />
  <text class="label" x="550" y="585">DataCore</text>
  <text class="small" x="550" y="608">Residency queries</text>

  <rect class="service platform" x="680" y="555" width="165" height="70" rx="14" />
  <text class="label" x="762" y="585">DataBridge</text>
  <text class="small" x="762" y="608">Authorized retrieval</text>

  <rect class="service control" x="585" y="190" width="170" height="72" rx="14" />
  <text class="label" x="670" y="220">TrustGate</text>
  <text class="small" x="670" y="243">control plane</text>

  <rect class="service data" x="340" y="190" width="170" height="72" rx="14" />
  <text class="label" x="425" y="220">TrustGate</text>
  <text class="small" x="425" y="243">hosted data plane</text>

  <rect class="service control" x="585" y="310" width="170" height="72" rx="14" />
  <text class="label" x="670" y="340">TrustGuard</text>
  <text class="small" x="670" y="363">control plane</text>

  <rect class="service data" x="340" y="310" width="170" height="72" rx="14" />
  <text class="label" x="425" y="340">TrustGuard</text>
  <text class="small" x="425" y="363">hosted data plane</text>

  <rect class="service security" x="230" y="250" width="80" height="72" rx="14" />
  <text class="label" x="270" y="280">NT</text>
  <text class="small" x="270" y="303">Firewall</text>

  <rect class="service platform" x="340" y="440" width="170" height="72" rx="14" />
  <text class="label" x="425" y="470">ClickStack</text>
  <text class="small" x="425" y="493">OTel Collector</text>

  <rect class="service platform" x="585" y="440" width="170" height="72" rx="14" />
  <text class="label" x="670" y="470">AlertEngine</text>
  <text class="small" x="670" y="493">Rules and alerts</text>

  <!-- Hybrid workloads -->
  <rect class="service data" x="1040" y="190" width="170" height="72" rx="14" />
  <text class="label" x="1125" y="220">TrustGate</text>
  <text class="small" x="1125" y="243">data plane</text>

  <rect class="service" x="1225" y="175" width="120" height="42" rx="12" />
  <text class="small" x="1285" y="201">LLM / proxy :8081</text>

  <rect class="service" x="1225" y="225" width="120" height="42" rx="12" />
  <text class="small" x="1285" y="251">MCP :8082</text>

  <rect class="service data" x="1040" y="355" width="170" height="72" rx="14" />
  <text class="label" x="1125" y="385">TrustGuard</text>
  <text class="small" x="1125" y="408">data plane</text>

  <rect class="service security" x="1235" y="272" width="85" height="72" rx="14" />
  <text class="label" x="1277" y="302">NT</text>
  <text class="small" x="1277" y="325">Firewall</text>

  <rect class="service platform" x="1040" y="575" width="170" height="72" rx="14" />
  <text class="label" x="1125" y="605">DataAgent</text>
  <text class="small" x="1125" y="626">Optional - enrollment-gated</text>
  <text class="small" x="1125" y="642">Outbound only</text>

  <!-- Managed services -->
  <rect class="store" x="20" y="435" width="130" height="82" rx="18" />
  <text class="label" x="85" y="468">ClickHouse</text>
  <text class="small" x="85" y="493">Cloud</text>

  <rect class="store" x="20" y="610" width="130" height="70" rx="18" />
  <text class="label" x="85" y="640">Cloud SQL</text>
  <text class="small" x="85" y="662">SaaS state</text>

  <rect class="store" x="20" y="710" width="130" height="70" rx="18" />
  <text class="label" x="85" y="740">Memorystore</text>
  <text class="small" x="85" y="762">SaaS cache</text>

  <rect class="store" x="1420" y="505" width="160" height="82" rx="18" />
  <text class="label" x="1500" y="538">PostgreSQL</text>
  <text class="small" x="1500" y="562">raw payloads</text>

  <rect class="store" x="1420" y="675" width="160" height="72" rx="18" />
  <text class="label" x="1500" y="705">Redis</text>
  <text class="small" x="1500" y="728">cache and state</text>

  <!-- SaaS internal flows -->
  <path class="flow" d="M510 226 H585" />
  <path class="flow" d="M510 346 H585" />
  <path class="flow" d="M340 226 C315 226 315 270 310 280" />
  <path class="flow" d="M340 346 C315 346 315 310 310 300" />
  <path class="flow" d="M550 680 V625" />
  <path class="flow" d="M625 590 H680" />

  <!-- SaaS managed-service flows -->
  <path class="flow" d="M340 476 H150" />
  <path class="flow" d="M150 476 C210 540 360 565 475 580" />
  <path class="flow" d="M150 460 C300 400 455 420 585 465" />
  <path class="flow" d="M585 476 C420 530 270 600 150 645" />
  <path class="flow" d="M475 715 C340 715 255 670 150 645" />
  <path class="flow" d="M475 730 C330 765 250 760 150 745" />

  <!-- Hybrid product flow -->
  <path class="flow" d="M1225 196 H1210" />
  <path class="flow" d="M1225 246 H1210" />
  <path class="flow" d="M1125 262 V355" />
  <path class="flow" d="M1210 391 C1250 391 1277 355 1277 344" />

  <!-- Outbound config-sync pulls -->
  <path class="flow" stroke-dasharray="7 6" d="M1040 215 C920 175 840 190 755 220" />
  <path class="flow" stroke-dasharray="7 6" d="M1040 380 C920 405 835 370 755 346" />
  <text class="flow-label" x="840" y="183">outbound config pull</text>

  <!-- Metadata -->
  <path class="metadata" d="M1040 235 C880 265 700 420 510 465" />
  <path class="metadata" d="M1040 400 C850 420 700 455 510 476" />
  <text class="flow-label metadata-label" x="790" y="390">metadata</text>

  <!-- Raw and state -->
  <path class="raw" d="M1210 226 C1350 250 1420 390 1420 525" />
  <path class="raw" d="M1210 400 C1320 420 1380 475 1420 535" />
  <path class="raw" d="M1420 565 C1350 575 1280 600 1210 611" />
  <text class="flow-label" x="1400" y="410">raw</text>
  <path class="raw" d="M1210 245 C1390 320 1430 570 1420 695" />
  <path class="raw" d="M1210 410 C1370 470 1410 590 1420 720" />

  <!-- Authorized retrieval -->
  <path class="flow" d="M845 575 C910 535 985 555 1040 595" />
  <path class="flow" d="M1040 625 C970 665 900 640 845 605" />
  <text class="flow-label" x="900" y="545">authorized request</text>
  <text class="flow-label" x="900" y="670">authorized response</text>

  <!-- Legend -->
  <line x1="215" y1="845" x2="270" y2="845" class="metadata" />
  <text class="subtitle" x="282" y="850">Metadata export</text>
  <line x1="470" y1="845" x2="525" y2="845" class="raw" />
  <text class="subtitle" x="537" y="850">Raw payload or state</text>
  <line x1="750" y1="845" x2="805" y2="845" class="flow" stroke-dasharray="7 6" />
  <text class="subtitle" x="817" y="850">Outbound config pull</text>
</svg>
