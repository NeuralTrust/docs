<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="860" viewBox="0 0 1560 860" role="img" aria-labelledby="title description">
  <title id="title">NeuralTrust Central control plane architecture</title>
  <desc id="description">In Central control plane mode you run the control plane yourself and remote Hybrid data planes in other clusters enrol into it instead of into NeuralTrust SaaS. Each remote cluster runs the request path — TrustGate, TrustGuard and Firewall — with its own PostgreSQL, Redis and DataAgent, and keeps raw payloads local. Every remote cluster opens four outbound connections to your central cluster: DataBridge for authorized retrieval, the ClickStack ingest gateway for OTLP telemetry, and one config-sync endpoint each for AgentGateway and TrustGuard. The central cluster runs the console, ClickHouse, DataCore and AlertEngine, and needs its own PostgreSQL and Redis as well. DataCore queries remote data through DataBridge rather than holding it locally.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#596579" />
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d5dfc" />
    </marker>
    <style>
      .boundary { fill: #f7fbff; stroke: #8bc5ea; stroke-width: 2.5; }
      .boundary-central { fill: #fafaff; stroke: #c9c5ff; stroke-width: 2.5; }
      .group { fill: #ffffff; stroke: #dde3ec; stroke-width: 2; stroke-dasharray: 6 5; }
      .service { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; }
      .control { fill: #f1efff; stroke: #8b7ffd; }
      .data { fill: #eef8ff; stroke: #61aee0; }
      .security { fill: #fff5e8; stroke: #f4aa4c; }
      .platform { fill: #effbf4; stroke: #55b77c; }
      .store { fill: #f9fafb; stroke: #98a2b3; stroke-width: 2; }
      .external { fill: #ffffff; stroke: #d0d5dd; stroke-width: 2; stroke-dasharray: 5 4; }
      .title { font: 700 22px Inter, Arial, sans-serif; fill: #101828; }
      .subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #667085; }
      .grouplabel { font: 600 14px Inter, Arial, sans-serif; fill: #667085; }
      .label { font: 650 17px Inter, Arial, sans-serif; fill: #1d2939; text-anchor: middle; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #667085; text-anchor: middle; }
      .flow { fill: none; stroke: #596579; stroke-width: 2.2; marker-end: url(#arrow); }
      .metadata { fill: none; stroke: #6d5dfc; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .flow-label { font: 600 13px Inter, Arial, sans-serif; fill: #475467; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
      .metadata-label { fill: #5b4ce1; }
    </style>
  </defs>

  <rect width="1560" height="860" rx="24" fill="#ffffff" />

  <!-- Remote clusters boundary -->
  <rect class="boundary" x="30" y="50" width="620" height="720" rx="28" />
  <text class="title" x="60" y="94">Remote clusters</text>
  <text class="subtitle" x="60" y="118">Hybrid data planes — one per region or business unit</text>

  <!-- Central cluster boundary -->
  <rect class="boundary-central" x="770" y="50" width="750" height="720" rx="28" />
  <text class="title" x="800" y="94">Your central cluster</text>
  <text class="subtitle" x="800" y="118">Control plane, console and analytics — you operate this</text>
  <!-- Stacked cluster hint (depth cue for "several clusters") -->
  <rect class="group" x="86" y="168" width="540" height="330" rx="20" />
  <rect class="group" x="72" y="182" width="540" height="330" rx="20" fill="#ffffff" />
  <text class="grouplabel" x="94" y="208">Cluster A — deploymentMode: hybrid</text>

  <rect class="service data" x="94" y="228" width="164" height="80" rx="14" />
  <text class="label" x="176" y="262">TrustGate</text>
  <text class="small" x="176" y="285">proxy · MCP</text>

  <rect class="service data" x="278" y="228" width="156" height="80" rx="14" />
  <text class="label" x="356" y="262">TrustGuard</text>
  <text class="small" x="356" y="285">data plane</text>

  <rect class="service security" x="454" y="228" width="140" height="80" rx="14" />
  <text class="label" x="524" y="262">Firewall</text>
  <text class="small" x="524" y="285">classifiers</text>

  <path class="flow" d="M258 268 H278" />
  <path class="flow" d="M434 268 H454" />

  <rect class="store" x="94" y="336" width="160" height="76" rx="14" />
  <text class="label" x="174" y="368">PostgreSQL</text>
  <text class="small" x="174" y="391">:5432 raw payloads</text>

  <rect class="store" x="274" y="336" width="120" height="76" rx="14" />
  <text class="label" x="334" y="368">Redis</text>
  <text class="small" x="334" y="391">:6379 cache</text>

  <rect class="service platform" x="414" y="336" width="180" height="76" rx="14" />
  <text class="label" x="504" y="366">DataAgent</text>
  <text class="small" x="504" y="389">+ egress collector</text>

  <path class="flow" d="M176 308 V336" />
  <path class="flow" d="M400 308 C400 322 480 322 490 336" />
  <text class="flow-label" x="470" y="326">OTLP</text>

  <text class="subtitle" x="94" y="452">Raw prompts and responses stay in this cluster.</text>
  <text class="subtitle" x="94" y="476">Cluster B, C … are identical, each with its own enrolment token.</text>
  <!-- Central: published edge (the four endpoints) -->
  <rect class="group" x="792" y="150" width="330" height="400" rx="18" />
  <text class="grouplabel" x="814" y="176">Published endpoints</text>

  <rect class="service control" x="814" y="196" width="286" height="72" rx="14" />
  <text class="label" x="957" y="226">DataBridge</text>
  <text class="small" x="957" y="248">databridge.&lt;domain&gt;:443</text>

  <rect class="service platform" x="814" y="288" width="286" height="72" rx="14" />
  <text class="label" x="957" y="318">ClickStack ingest gateway</text>
  <text class="small" x="957" y="340">telemetry.&lt;domain&gt; · verifies JWT</text>

  <rect class="service control" x="814" y="380" width="286" height="66" rx="14" />
  <text class="label" x="957" y="408">AgentGateway config-sync</text>
  <text class="small" x="957" y="430">agentgateway-configsync.&lt;domain&gt;</text>

  <rect class="service control" x="814" y="462" width="286" height="66" rx="14" />
  <text class="label" x="957" y="490">TrustGuard config-sync</text>
  <text class="small" x="957" y="512">trustguard-configsync.&lt;domain&gt;</text>
  <!-- Central: internal stack -->
  <rect class="group" x="1150" y="150" width="348" height="400" rx="18" />
  <text class="grouplabel" x="1172" y="176">Control plane and analytics</text>

  <rect class="service platform" x="1172" y="196" width="304" height="72" rx="14" />
  <text class="label" x="1324" y="226">Console + API</text>
  <text class="small" x="1324" y="248">one place to administer all clusters</text>

  <rect class="service control" x="1172" y="288" width="304" height="60" rx="14" />
  <text class="label" x="1324" y="324">DataCore</text>

  <rect class="store" x="1172" y="368" width="304" height="60" rx="14" />
  <text class="label" x="1324" y="396">ClickHouse</text>
  <text class="small" x="1324" y="416">:8123 · :9000</text>

  <rect class="service control" x="1172" y="448" width="304" height="60" rx="14" />
  <text class="label" x="1324" y="484">AlertEngine</text>

  <path class="flow" d="M1324 268 V288" />
  <path class="metadata" d="M1324 348 V368" />
  <path class="metadata" d="M1324 428 V448" />

  <!-- Ingest gateway writes to ClickHouse; DataCore reads remote via DataBridge -->
  <path class="metadata" d="M1100 318 C1140 318 1150 390 1172 396" />
  <text class="flow-label metadata-label" x="1136" y="366">writes</text>

  <path class="metadata" d="M1172 312 C1140 300 1120 240 1100 232" />
  <text class="flow-label metadata-label" x="1150" y="268">queries</text>
  <!-- Cross-cluster: every connection initiated by the remote cluster -->
  <path class="metadata" d="M594 374 C680 374 700 232 814 232" />
  <text class="flow-label metadata-label" x="700" y="300">retrieval 443</text>

  <path class="metadata" d="M594 390 C660 400 720 324 814 324" />
  <text class="flow-label metadata-label" x="706" y="392">OTLP 443</text>

  <path class="metadata" d="M258 268 C258 150 700 132 814 404" />
  <text class="flow-label metadata-label" x="700" y="140">config sync 443</text>

  <path class="metadata" d="M434 300 C620 300 700 470 814 494" />
  <text class="flow-label metadata-label" x="686" y="470">config sync 443</text>

  <!-- Central datastores -->
  <rect class="group" x="792" y="590" width="490" height="150" rx="18" />
  <text class="grouplabel" x="814" y="616">Central datastores</text>

  <rect class="store" x="814" y="636" width="220" height="86" rx="14" />
  <text class="label" x="924" y="670">PostgreSQL</text>
  <text class="small" x="924" y="693">:5432 five databases</text>

  <rect class="store" x="1054" y="636" width="208" height="86" rx="14" />
  <text class="label" x="1158" y="670">Redis</text>
  <text class="small" x="1158" y="693">:6379 cache, limits</text>

  <path class="flow" d="M1220 550 C1200 590 1000 590 960 636" />
  <text class="flow-label" x="1078" y="586">control-plane state</text>

  <path class="flow" d="M1400 550 C1380 596 1200 596 1158 636" />
  <text class="flow-label" x="1300" y="614">cache and limits</text>

  <!-- Legend -->
  <line x1="60" y1="812" x2="110" y2="812" class="flow" />
  <text class="subtitle" x="122" y="817">Request path — local to each cluster</text>
  <line x1="420" y1="812" x2="470" y2="812" class="metadata" />
  <text class="subtitle" x="482" y="817">Cross-cluster — all four connections are initiated by the remote cluster. The central cluster never dials in.</text>
</svg>
