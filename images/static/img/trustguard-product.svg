<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="560"
  viewBox="0 0 1200 560"
  fill="none"
  role="img"
  aria-labelledby="trustguard-title trustguard-description"
>
  <title id="trustguard-title">How TrustGuard evaluates AI traffic</title>
  <desc id="trustguard-description">
    A collector sends input or output to TrustGuard. TrustGuard selects a policy,
    evaluates gates and detector rules, and returns a structured verdict for the
    collector to apply.
  </desc>

  <defs>
    <linearGradient id="frame" x1="26" y1="10" x2="1040" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#383838" />
      <stop offset="0.17" stop-color="#709A71" />
      <stop offset="0.34" stop-color="#32A39E" />
      <stop offset="0.52" stop-color="#4456BA" />
      <stop offset="0.7" stop-color="#5B2B78" />
      <stop offset="0.86" stop-color="#2E5880" />
      <stop offset="1" stop-color="#9E9E9E" />
    </linearGradient>
    <linearGradient id="accent" x1="300" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6686F9" />
      <stop offset="1" stop-color="#BEA6F7" />
    </linearGradient>
    <linearGradient id="panel" x1="40" y1="320" x2="1160" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42447C" />
      <stop offset="0.5" stop-color="#7D66F9" />
      <stop offset="1" stop-color="#01C0FF" />
    </linearGradient>
    <radialGradient id="header-glow" cx="0" cy="0" r="1" gradientTransform="translate(600 32) rotate(90) scale(125 390)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4456BA" stop-opacity="0.34" />
      <stop offset="1" stop-color="#17191C" stop-opacity="0" />
    </radialGradient>
    <filter id="panel-glow" x="-10%" y="-30%" width="120%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7D66F9" />
    </marker>
    <symbol id="neuraltrust-mark" viewBox="240 28 60 34">
      <path
        fill="#FFFFFF"
        d="M266.528 35.905c-.422-.593-1.022-.656-1.219-.63a1.49 1.49 0 0 0-1.241.66L248.67 58.274h-6.422l17.443-25.304a6.77 6.77 0 0 1 5.53-2.97h.087a6.8 6.8 0 0 1 5.536 2.853l4.732 6.653-3.197 4.626z"
      />
      <path
        fill="#FFFFFF"
        d="M272.481 54.725a1.49 1.49 0 0 0 1.212-.66l15.603-22.263h6.457l-17.697 25.246c-1.225 1.819-3.289 2.923-5.519 2.951h-.085a6.8 6.8 0 0 1-5.536-2.852l-4.847-6.815 3.197-4.626 5.967 8.39c.416.585 1.02.616 1.248.628"
      />
    </symbol>
  </defs>

