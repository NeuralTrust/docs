<text x="990" y="426" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e4e7ec" text-anchor="middle">Self-hosted, air-gapped</text>
<text x="990" y="450" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a2b3" text-anchor="middle">Firewall runs in your cluster too</text>
<text x="990" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a2b3" text-anchor="middle">no connection to NeuralTrust</text>
