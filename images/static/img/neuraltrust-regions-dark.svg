<text x="210" y="426" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e4e7ec" text-anchor="middle">Hybrid data plane</text>
<text x="210" y="450" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a2b3" text-anchor="middle">TrustGate · TrustGuard · DataAgent</text>
<text x="210" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a2b3" text-anchor="middle">payloads stay in your PostgreSQL</text>
