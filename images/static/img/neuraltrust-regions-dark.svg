<text x="600" y="468" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a2b3" text-anchor="middle">all in your cluster</text>
<text x="600" y="486" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98a2b3" text-anchor="middle">calls only the inference plane</text>
<text x="600" y="526" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#b0b8c6" text-anchor="middle">firewall key issued for US</text>
