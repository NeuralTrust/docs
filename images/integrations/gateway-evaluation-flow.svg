<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="480"
  viewBox="0 0 1200 480"
  fill="none"
  role="img"
  aria-labelledby="gateway-flow-title gateway-flow-desc"
>
  <title id="gateway-flow-title">TrustGuard evaluation called from an AI gateway</title>
  <desc id="gateway-flow-desc">
    An application sends request and response traffic through an AI gateway. At
    its input and output policy stages, the gateway sends content to the separate
    TrustGuard service and receives a verdict. Enforcement depends on the gateway
    adapter and streaming mode; some streamed outputs are evaluated after delivery.
  </desc>

  <defs>
    <linearGradient id="gateway-bg" x1="24" y1="0" x2="1135" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17191F" />
      <stop offset="1" stop-color="#101218" />
    </linearGradient>
    <linearGradient id="gateway-box" x1="414" y1="121" x2="786" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#235B90" />
      <stop offset="1" stop-color="#4E429A" />
    </linearGradient>
    <linearGradient id="gateway-trustguard" x1="458" y1="366" x2="742" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6247C8" />
      <stop offset="1" stop-color="#2E70B8" />
    </linearGradient>
    <filter id="gateway-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <marker id="gateway-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62AFE9" />
    </marker>
    <marker id="gateway-arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A087EB" />
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="478" rx="23" fill="url(#gateway-bg)" stroke="#343842" stroke-width="2" />
  <circle cx="1090" cy="10" r="150" fill="#2E83CF" fill-opacity="0.06" />
  <circle cx="250" cy="472" r="145" fill="#7250D9" fill-opacity="0.06" />

  <text x="44" y="48" fill="#F5F7FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="650">
    TrustGuard evaluation from an AI gateway
  </text>
  <text x="44" y="79" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">
    The gateway owns the traffic path and calls TrustGuard at its policy stages.
  </text>

  <path d="M 230 174 H 414" stroke="#62AFE9" stroke-width="3" marker-end="url(#gateway-arrow-blue)" />
  <path d="M 786 174 H 970" stroke="#62AFE9" stroke-width="3" marker-end="url(#gateway-arrow-blue)" />
  <path d="M 970 275 H 786" stroke="#A087EB" stroke-width="3" marker-end="url(#gateway-arrow-violet)" />
  <path d="M 414 275 H 230" stroke="#A087EB" stroke-width="3" marker-end="url(#gateway-arrow-violet)" />
  <path d="M 515 316 C 515 339, 500 344, 500 366" stroke="#62AFE9" stroke-width="3" marker-end="url(#gateway-arrow-blue)" />
  <path d="M 700 366 C 700 344, 685 339, 685 316" stroke="#A087EB" stroke-width="3" marker-end="url(#gateway-arrow-violet)" />

  <text x="322" y="160" fill="#82C2F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    request
  </text>
  <text x="878" y="160" fill="#82C2F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    forward
  </text>
  <text x="878" y="263" fill="#B8A4F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    response
  </text>
  <text x="322" y="263" fill="#B8A4F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    deliver
  </text>
  <text x="465" y="347" fill="#82C2F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    content
  </text>
  <text x="735" y="347" fill="#B8A4F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    verdict
  </text>

  <g filter="url(#gateway-shadow)">
    <rect x="42" y="123" width="188" height="206" rx="17" fill="#20232B" stroke="#464C59" />
    <rect x="414" y="121" width="372" height="195" rx="18" fill="url(#gateway-box)" stroke="#7081D8" stroke-opacity="0.72" />
    <rect x="970" y="123" width="188" height="206" rx="17" fill="#20232B" stroke="#464C59" />
    <rect x="458" y="366" width="284" height="86" rx="15" fill="url(#gateway-trustguard)" stroke="#8B7BE9" stroke-opacity="0.72" />
  </g>

  <text x="136" y="214" fill="#F7F8FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650" text-anchor="middle">
    Application
  </text>
  <text x="136" y="245" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Gateway client
  </text>

  <text x="600" y="166" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    AI gateway
  </text>
  <text x="600" y="202" fill="#E4E9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" text-anchor="middle">
    Routes request and response traffic
  </text>
  <rect x="449" y="232" width="137" height="48" rx="12" fill="#182D4B" stroke="#6E9DCE" />
  <rect x="614" y="232" width="137" height="48" rx="12" fill="#302653" stroke="#8D79D1" />
  <text x="517.5" y="262" fill="#DCEBFA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="middle">
    Input stage
  </text>
  <text x="682.5" y="262" fill="#ECE5FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="middle">
    Output stage
  </text>
  <text x="600" y="301" fill="#CFD9EB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Applies the returned verdict
  </text>

  <text x="1064" y="214" fill="#F7F8FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650" text-anchor="middle">
    Provider
  </text>
  <text x="1064" y="245" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Upstream service
  </text>

  <text x="600" y="402" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    TrustGuard
  </text>
  <text x="600" y="431" fill="#E4E9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Evaluate against policy
  </text>
</svg>
