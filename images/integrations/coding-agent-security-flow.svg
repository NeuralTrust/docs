<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="450"
  viewBox="0 0 1200 450"
  fill="none"
  role="img"
  aria-labelledby="coding-agent-title coding-agent-desc"
>
  <title id="coding-agent-title">Separate security paths for coding agents</title>
  <desc id="coding-agent-desc">
    A coding agent sends local lifecycle events through a host hook to TrustGuard.
    Its remote MCP tool traffic follows a separate path through TrustGate to MCP
    servers assigned to the consumer.
  </desc>

  <defs>
    <linearGradient id="coding-bg" x1="40" y1="12" x2="1120" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17191F" />
      <stop offset="1" stop-color="#101218" />
    </linearGradient>
    <linearGradient id="trustguard-fill" x1="610" y1="139" x2="810" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B45C8" />
      <stop offset="1" stop-color="#2E72B9" />
    </linearGradient>
    <linearGradient id="trustgate-fill" x1="418" y1="313" x2="650" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#275A9B" />
      <stop offset="1" stop-color="#6245C6" />
    </linearGradient>
    <filter id="coding-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <marker id="coding-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8190A8" />
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="448" rx="23" fill="url(#coding-bg)" stroke="#343842" stroke-width="2" />
  <circle cx="1110" cy="35" r="108" fill="#6048E8" fill-opacity="0.08" />
  <circle cx="68" cy="430" r="125" fill="#2C8CD7" fill-opacity="0.06" />

  <text x="44" y="48" fill="#F5F7FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="650">
    Two separate controls for coding agents
  </text>
  <text x="44" y="79" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">
    Local lifecycle events and remote MCP access follow different paths.
  </text>

  <rect x="272" y="104" width="880" height="148" rx="18" fill="#151820" stroke="#2D323D" />
  <rect x="272" y="276" width="880" height="145" rx="18" fill="#151820" stroke="#2D323D" />
  <text x="298" y="135" fill="#96B2E2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">
    LOCAL LIFECYCLE EVENTS
  </text>
  <text x="298" y="309" fill="#B29CED" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2">
    REMOTE MCP ACCESS
  </text>

  <path d="M 232 202 C 270 202, 281 188, 321 188" stroke="#8190A8" stroke-width="3" marker-end="url(#coding-arrow)" />
  <path d="M 521 188 H 602" stroke="#8190A8" stroke-width="3" marker-end="url(#coding-arrow)" />
  <path d="M 810 188 H 892" stroke="#8190A8" stroke-width="3" marker-end="url(#coding-arrow)" />
  <path d="M 218 249 C 274 249, 314 358, 409 358" stroke="#8190A8" stroke-width="3" marker-end="url(#coding-arrow)" />
  <path d="M 650 358 H 805" stroke="#8190A8" stroke-width="3" marker-end="url(#coding-arrow)" />
  <text x="562" y="176" fill="#AEB7C5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    tgk_…
  </text>
  <text x="728" y="346" fill="#AEB7C5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    OAuth or ag_…
  </text>

  <g filter="url(#coding-shadow)">
    <rect x="42" y="161" width="190" height="116" rx="16" fill="#20232B" stroke="#464C59" />
    <rect x="321" y="143" width="200" height="90" rx="14" fill="#20232B" stroke="#464C59" />
    <rect x="602" y="139" width="208" height="98" rx="15" fill="url(#trustguard-fill)" stroke="#8581F2" stroke-opacity="0.65" />
    <rect x="892" y="139" width="235" height="98" rx="15" fill="#20232B" stroke="#464C59" />
    <rect x="409" y="313" width="241" height="94" rx="15" fill="url(#trustgate-fill)" stroke="#7B75E7" stroke-opacity="0.65" />
    <rect x="805" y="313" width="310" height="94" rx="15" fill="#20232B" stroke="#464C59" />
  </g>

  <text x="137" y="201" fill="#F7F8FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650" text-anchor="middle">
    Coding agent
  </text>
  <text x="137" y="232" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Claude · Cursor
  </text>
  <text x="137" y="257" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Codex · Copilot
  </text>

  <text x="421" y="181" fill="#F7F8FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650" text-anchor="middle">
    Lifecycle hook
  </text>
  <text x="421" y="210" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Prompt · command · tool
  </text>

  <text x="706" y="181" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    TrustGuard
  </text>
  <text x="706" y="211" fill="#E4E9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Policy evaluation
  </text>

  <text x="1009.5" y="181" fill="#F7F8FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="650" text-anchor="middle">
    Host applies verdict
  </text>
  <text x="1009.5" y="211" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Client-specific behavior
  </text>

  <text x="529.5" y="352" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    TrustGate MCP
  </text>
  <text x="529.5" y="382" fill="#E4E9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Identity · toolkit · limits
  </text>

  <text x="960" y="352" fill="#F7F8FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650" text-anchor="middle">
    Assigned MCP servers
  </text>
  <text x="960" y="382" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Consumer-approved tools
  </text>
</svg>
