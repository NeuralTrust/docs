<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="430"
  viewBox="0 0 1200 430"
  fill="none"
  role="img"
  aria-labelledby="edge-flow-title edge-flow-desc"
>
  <title id="edge-flow-title">Request evaluation on configured Edge and WAF routes</title>
  <desc id="edge-flow-desc">
    A client request on a configured AI route reaches an edge function. The
    function sends request content to TrustGuard and applies its verdict. Allowed
    requests continue to the AI origin, blocked requests stop at the edge, and
    the origin response is not evaluated by TrustGuard.
  </desc>

  <defs>
    <linearGradient id="edge-bg" x1="20" y1="0" x2="1135" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17191F" />
      <stop offset="1" stop-color="#101218" />
    </linearGradient>
    <linearGradient id="edge-runtime" x1="336" y1="139" x2="618" y2="281" gradientUnits="userSpaceOnUse">
      <stop stop-color="#214D80" />
      <stop offset="1" stop-color="#3E438F" />
    </linearGradient>
    <linearGradient id="edge-trustguard" x1="687" y1="312" x2="929" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6449C8" />
      <stop offset="1" stop-color="#2D6EB4" />
    </linearGradient>
    <filter id="edge-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <marker id="edge-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6CAEE6" />
    </marker>
    <marker id="edge-arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9B84EA" />
    </marker>
    <marker id="edge-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F17878" />
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="23" fill="url(#edge-bg)" stroke="#343842" stroke-width="2" />
  <circle cx="1105" cy="16" r="135" fill="#2A80CA" fill-opacity="0.06" />
  <circle cx="146" cy="425" r="125" fill="#6A4AD2" fill-opacity="0.06" />

  <text x="44" y="48" fill="#F5F7FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="650">
    Request inspection at the edge
  </text>
  <text x="44" y="79" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18">
    Only requests on configured AI paths enter the evaluation flow.
  </text>

  <path d="M 222 211 H 336" stroke="#6CAEE6" stroke-width="3" marker-end="url(#edge-arrow)" />
  <path d="M 618 211 H 967" stroke="#6CAEE6" stroke-width="3" marker-end="url(#edge-arrow)" />
  <path d="M 1060 153 C 1060 108, 160 108, 160 157" stroke="#9B84EA" stroke-width="2.5" marker-end="url(#edge-arrow-violet)" />
  <path d="M 547 281 C 587 319, 625 335, 687 348" stroke="#6CAEE6" stroke-width="2.5" marker-end="url(#edge-arrow)" />
  <path d="M 688 385 C 610 391, 558 340, 520 285" stroke="#9B84EA" stroke-width="2.5" marker-end="url(#edge-arrow-violet)" />
  <path d="M 418 281 V 328" stroke="#F17878" stroke-width="2.5" marker-end="url(#edge-arrow-red)" />

  <text x="279" y="195" fill="#82C2F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    matching route
  </text>
  <text x="792" y="195" fill="#82C2F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    forward
  </text>
  <text x="613" y="310" fill="#82C2F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    request
  </text>
  <text x="625" y="409" fill="#B8A4F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    verdict
  </text>
  <text x="610" y="102" fill="#B8A4F2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Origin response is not evaluated by TrustGuard
  </text>

  <g filter="url(#edge-shadow)">
    <rect x="42" y="157" width="180" height="108" rx="16" fill="#20232B" stroke="#464C59" />
    <rect x="336" y="139" width="282" height="142" rx="17" fill="url(#edge-runtime)" stroke="#6686D5" stroke-opacity="0.72" />
    <rect x="967" y="157" width="188" height="108" rx="16" fill="#20232B" stroke="#464C59" />
    <rect x="687" y="312" width="242" height="95" rx="15" fill="url(#edge-trustguard)" stroke="#877DE9" stroke-opacity="0.72" />
    <rect x="320" y="333" width="196" height="62" rx="13" fill="#3A2025" stroke="#9D4A54" />
  </g>

  <text x="132" y="203" fill="#F7F8FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650" text-anchor="middle">
    Client
  </text>
  <text x="132" y="235" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    AI request
  </text>

  <text x="477" y="186" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    Edge function
  </text>
  <text x="477" y="221" fill="#E4E9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" text-anchor="middle">
    Read request body
  </text>
  <text x="477" y="253" fill="#E4E9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" text-anchor="middle">
    Apply the verdict
  </text>

  <text x="1061" y="203" fill="#F7F8FB" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650" text-anchor="middle">
    AI origin
  </text>
  <text x="1061" y="235" fill="#B5BDCA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Application
  </text>

  <text x="808" y="350" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    TrustGuard
  </text>
  <text x="808" y="382" fill="#E4E9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" text-anchor="middle">
    Input policy
  </text>

  <text x="418" y="372" fill="#F7C5C5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650" text-anchor="middle">
    Block at the edge
  </text>
</svg>
